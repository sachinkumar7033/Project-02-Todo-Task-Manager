<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do Task Manager | Project #02</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <main class="todo-container">


        
        <!-- HEADER -->
        

        <header class="todo-header">

            <h1>To-Do Task Manager</h1>

            <p>Project #02</p>

        </header>


        
        <!-- ADD TASK SECTION -->
   

        <section class="add-task-section">

            <!-- Task Name -->
            <input
                type="text"
                id="task-input"
                placeholder="What do you need to do?"
                autocomplete="off"
            >


            <!-- Task Date -->
            <input
                type="date"
                id="task-date"
            >


            <!-- Task Priority -->
            <select id="task-priority">

                <option value="low">
                    Low
                </option>

                <option value="medium" selected>
                    Medium
                </option>

                <option value="high">
                    High
                </option>

            </select>


            <!-- Add Button -->
            <button
                type="button"
                id="add-task-button">

                Add Task

            </button>

        </section>


        <!-- SEARCH SECTION -->

        <section class="search-section">

            <input
                type="text"
                id="search-input"
                placeholder="Search tasks..."
                autocomplete="off"
            >

        </section>


        <!-- FILTER SECTION -->

        <section class="filter-section">

            <button
                type="button"
                class="filter-button active"
                data-filter="all">

                All

            </button>


            <button
                type="button"
                class="filter-button"
                data-filter="pending">

                Pending

            </button>


            <button
                type="button"
                class="filter-button"
                data-filter="completed">

                Completed

            </button>

        </section>


        <!-- TASK LIST -->

        <section
            class="task-list"
            id="task-list">

            <!--
                JavaScript will dynamically
                create tasks here.
            -->

        </section>


        <!-- TASK COUNTER -->

        <footer class="task-counter">

            <span>
                Total:
                <strong id="total-count">0</strong>
            </span>


            <span>
                Pending:
                <strong id="pending-count">0</strong>
            </span>


            <span>
                Completed:
                <strong id="completed-count">0</strong>
            </span>

        </footer>


    </main>


    <!-- JAVASCRIPT -->

    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
